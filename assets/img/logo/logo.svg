<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="Kürşatcan Çankaroğlu">
  <defs>
    <linearGradient id="kcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28E98C"/>
      <stop offset="1" stop-color="#10D4B4"/>
    </linearGradient>
    <style>
      .name1{font-family:Manrope,Segoe UI,Arial,sans-serif;font-weight:900;font-size:20px;fill:#111214}
      .name2{font-family:Manrope,Segoe UI,Arial,sans-serif;font-weight:700;font-size:18px;fill:#6B7280}
      .mono{font-family:Manrope,Segoe UI,Arial,sans-serif;font-weight:900;font-size:18px;fill:#ffffff;letter-spacing:.5px}
    </style>
  </defs>

  <!-- Ben burada logoyu daha modern ve küçük ekranlarda okunaklı olacak şekilde tasarlıyorum -->
  <circle cx="32" cy="32" r="24" fill="url(#kcGrad)"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" opacity="0.22"/>
  <text x="32" y="39" text-anchor="middle" class="mono">KÇ</text>

  <text x="68" y="28" class="name1">Kürşatcan</text>
  <text x="68" y="50" class="name2">Çankaroğlu</text>
</svg>
