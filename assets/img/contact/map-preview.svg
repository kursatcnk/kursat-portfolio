<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none" role="img" aria-label="Harita önizleme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#151B2B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 320) rotate(90) scale(420 520)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="28" fill="url(#grid)" opacity="0.9"/>
  <rect width="1200" height="760" rx="28" fill="url(#glow)"/>

  <!-- abstract roads -->
  <g opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-40 540C160 470 260 410 420 420C600 432 650 520 820 520C980 520 1080 430 1240 380" stroke="rgba(255,255,255,0.18)" stroke-width="10"/>
    <path d="M-60 250C120 310 250 340 360 320C520 288 600 180 760 190C920 200 1040 320 1260 330" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
    <path d="M80 720C180 610 260 560 360 560C520 560 620 650 740 640C880 626 960 520 1120 500" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
  </g>

  <!-- highlight area -->
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="720" cy="330" r="120" fill="rgba(124,58,237,0.35)"/>
    <circle cx="720" cy="330" r="70" fill="rgba(34,197,94,0.18)"/>
  </g>

  <!-- pin -->
  <g transform="translate(720 330)">
    <circle cx="0" cy="0" r="44" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)"/>
    <path d="M0 -72c-33 0-60 27-60 60 0 46 60 132 60 132s60-86 60-132c0-33-27-60-60-60z" fill="#22C55E"/>
    <circle cx="0" cy="-12" r="22" fill="#0B1220" opacity="0.95"/>
    <circle cx="0" cy="-12" r="10" fill="rgba(255,255,255,0.85)"/>
  </g>

  <!-- label -->
  <g opacity="0.9">
    <rect x="64" y="64" width="360" height="112" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
    <text x="96" y="112" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="650">İstanbul • Türkiye</text>
    <text x="96" y="148" fill="rgba(255,255,255,0.70)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="16">Harita embed edilmez. Yeni sekmede açılır.</text>
  </g>
</svg>
