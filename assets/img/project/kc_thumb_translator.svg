<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Çeviri Uygulaması">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f10"/>
      <stop offset="0.55" stop-color="#2b1a44"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="60%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#g)"/>
  <circle cx="360" cy="180" r="380" fill="url(#glow1)" filter="url(#soft)"/>
  <circle cx="1280" cy="640" r="420" fill="url(#glow2)" filter="url(#soft)"/>

  <!-- subtle grid -->
  <g opacity="0.12" stroke="#ffffff">
    <path d="M0 120H1600M0 300H1600M0 480H1600M0 660H1600M0 840H1600" stroke-width="1"/>
    <path d="M160 0V900M360 0V900M560 0V900M760 0V900M960 0V900M1160 0V900M1360 0V900" stroke-width="1"/>
  </g>

  <!-- badge -->
  <g transform="translate(110,120)">
    <rect x="0" y="0" rx="26" ry="26" width="190" height="54" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.22)" />
    <text x="95" y="36" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.08em">.NET</text>
  </g>

  <!-- title -->
  <g transform="translate(110,0)">
    <text x="0" y="520" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Çeviri Uygulaması</text>
    <text x="0" y="590" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial" font-size="30" font-weight="600" fill="rgba(255,255,255,0.82)"> .NET • Dil Çeviri</text>
  </g>

  <!-- footer -->
  <g opacity="0.9">
    <text x="110" y="820" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial" font-size="18" font-weight="600" fill="rgba(255,255,255,0.70)">Kürşatcan Çankaroğlu • Proje Görseli</text>
  </g>
</svg>